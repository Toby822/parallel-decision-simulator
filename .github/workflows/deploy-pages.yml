name: Publish research web apps

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'markout-lab/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy public research apps
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate simulation scripts
        run: |
          set -euo pipefail
          for f in dist/app.js dist/model.js dist/agent.js dist/simulation-worker.js markout-lab/sim.js markout-lab/app.js; do
            test -s "$f"
            node --check "$f"
          done
          node markout-lab/tests/test-sim.cjs
          test -s markout-lab/index.html
          test -s markout-lab/style.css

      - name: Stage Markout Lab alongside Parallel
        run: |
          mkdir -p dist/markout-lab
          cp markout-lab/index.html markout-lab/style.css markout-lab/sim.js markout-lab/app.js markout-lab/favicon.svg dist/markout-lab/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/markout-lab/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
