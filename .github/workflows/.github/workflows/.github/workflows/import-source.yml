name: Import Parallel source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unpack project and save source
        run: |
          echo '904bd1e44c0a06d6a657be3dbdd27ddbdb304da78cd5a4cda1c4b89d0b20db6d  Parallel-Prototype.zip' | sha256sum -c -
          unzip -q Parallel-Prototype.zip -d "$RUNNER_TEMP/parallel-import"
          cp -R "$RUNNER_TEMP/parallel-import/Parallel-Prototype/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore LICENSE README.md dist docs parallel requirements.txt scripts tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add unpacked Parallel source"
          git push
