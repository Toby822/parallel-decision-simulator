name: Markout browser QA

on:
  push:
    branches: [main]
    paths:
      - 'markout-lab/**'
      - '.github/workflows/markout-e2e.yml'
  pull_request:
    paths:
      - 'markout-lab/**'
      - '.github/workflows/markout-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium end-to-end UI and simulation smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Verify browser javascript and numerical properties
        run: |
          node --check markout-lab/sim.js
          node --check markout-lab/app.js
          node markout-lab/tests/test-sim.cjs
      - name: Test dashboard in headless Chromium
        run: node markout-lab/tests/e2e.cjs
      - name: Save quality-assurance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markout-lab-qa-screenshots
          path: |
            /tmp/markout-desktop.png
            /tmp/markout-mobile.png
          if-no-files-found: ignore
