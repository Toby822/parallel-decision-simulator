name: Import Parallel source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-source.yml
      - Parallel-Prototype.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate and unpack the project source
        shell: bash
        run: |
          set -euo pipefail
          test -s Parallel-Prototype.zip
          sha256sum Parallel-Prototype.zip
          unzip -tq Parallel-Prototype.zip
          mkdir -p "$RUNNER_TEMP/parallel-source"
          unzip -q Parallel-Prototype.zip -d "$RUNNER_TEMP/parallel-source"

          ROOT="$RUNNER_TEMP/parallel-source"
          if [[ -f "$ROOT/Parallel-Prototype/README.md" ]]; then
            ROOT="$ROOT/Parallel-Prototype"
          fi
          if [[ ! -f "$ROOT/README.md" || ! -d "$ROOT/parallel" ]]; then
            echo "Could not find the project README.md and parallel/ folder inside the archive."
            find "$RUNNER_TEMP/parallel-source" -maxdepth 3 -type f | head -60
            exit 1
          fi

          for path in README.md LICENSE .gitignore requirements.txt parallel dist docs scripts tests; do
            if [[ -e "$ROOT/$path" ]]; then
              cp -R "$ROOT/$path" .
            fi
          done

      - name: Commit extracted source to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in README.md LICENSE .gitignore requirements.txt parallel dist docs scripts tests; do
            if [[ -e "$path" ]]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "Source already imported; no changes."
            exit 0
          fi
          git commit -m "Import unpacked Parallel project source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
